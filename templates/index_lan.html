                        return;
                    }
                }
                if (e.pointerType === 'pen' && !CC.penSeen) {
                    CC.penSeen = true;
                    document.body.classList.add('pen-seen');
                    // 使用者手動選過模式後，不再自動切換
                    if (!CC.penManual) {
                        setPenMode(true);
                        toast('✍️ 已切換觸控筆模式：只用筆書寫（點右上角按鈕可切回手寫）');
                    }
                }
                if (e.pointerType === 'touch' && CC.penMode) return;
                if (e.pointerType === 'mouse' && e.button !== 0) return;
                if (CC.cur || CC.anim) return;
                e.preventDefault();
                try { fcan.setPointerCapture(e.pointerId); } catch (err) { }
                CC.pid = e.pointerId;
                CC.cur = {
                    tool: CC.tool === 'eraser' ? 'eraser' : 'pen', color: CC.color,
                    w: CSIZE[CC.tool], pts: [calcPt(e)], ptype: e.pointerType
                };
                drawCalcSeg(CC.cur, 0);
            });

            fcan.addEventListener('pointermove', e => {
                if (e.pointerType === 'touch' && CC.touches.has(e.pointerId)) {
                    CC.touches.set(e.pointerId, [e.clientX, e.clientY]);
                    if (CC.touches.size >= 2 && CC.pinch0) {
                        if (touchDist() < CC.pinch0 * 0.65) { CC.touches.clear(); CC.pinch0 = 0; closeFocus(); }
                        return;
                    }
                }
                if (!CC.cur || e.pointerId !== CC.pid) return;
                e.preventDefault();
                let evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
                if (!evs || !evs.length) evs = [e];
                const before = CC.cur.pts.length;
                evs.forEach(ev => CC.cur.pts.push(calcPt(ev)));
                drawCalcSeg(CC.cur, before);
            });

            function endCalcStroke(e) {
                if (e.pointerType === 'touch') {
                    CC.touches.delete(e.pointerId);
                    if (CC.touches.size < 2) CC.pinch0 = 0;
                }
                if (!CC.cur || e.pointerId !== CC.pid) return;
                const st = CC.cur;
                CC.cur = null; CC.pid = null;
                delete st.ptype;
                CC.pages[CC.focus].push(st);
                CC.hist.push(CC.focus);
                renderPage(fcan, fctx, CC.focus, CC.fs, 0, 0);
                renderThumb(CC.focus);  // 即時同步四宮格縮圖
            }
            fcan.addEventListener('pointerup', endCalcStroke);
            fcan.addEventListener('pointercancel', endCalcStroke);
            fcan.addEventListener('lostpointercapture', endCalcStroke);

            $('#calcUndo').onclick = () => {
                const target = CC.focus >= 0 ? CC.focus : CC.hist[CC.hist.length - 1];
                if (target === undefined || !CC.pages[target].length) return;
                CC.pages[target].pop();
                const at = CC.hist.lastIndexOf(target);
                if (at >= 0) CC.hist.splice(at, 1);
                renderThumb(target);
                if (CC.focus >= 0) renderPage(fcan, fctx, CC.focus, CC.fs, 0, 0);
            };

            $('#calcClear').onclick = () => {
                const page = CC.focus >= 0 ? CC.focus : CC.last;
                const m = $('#calcClearModal');
                $('#ccPage').textContent = `清除第 ${page + 1} 頁`;
                $('#ccAll').textContent = `清除全部 ${CC.pages.length} 頁`;
                $('#ccDel').textContent = `🗑 刪除第 ${page + 1} 頁`;
                $('#ccDel').style.display = CC.pages.length > 1 ? '' : 'none';
                m.classList.add('show');
                const close = () => m.classList.remove('show');
                $('#ccCancel').onclick = close;
                $('#ccPage').onclick = () => {
                    CC.pages[page] = [];
                    CC.hist = CC.hist.filter(x => x !== page);
                    close(); calcLayout();
                };
                $('#ccAll').onclick = () => {
                    CC.pages = CC.pages.map(() => []);
                    CC.hist = [];
                    close(); calcLayout();
                };
                $('#ccDel').onclick = () => {
                    close();
                    deleteCalcPage(page);
                };
            };

            // 單頁圖片（格線 + 墨跡），k = 縮放倍率
            function calcPageImage(i, k) {
                const w = Math.round(CC.PW * k), h = Math.round(CC.PH * k);
                const out = document.createElement('canvas');
                out.width = w; out.height = h;
                const o = out.getContext('2d');
                o.fillStyle = '#fff';
                o.fillRect(0, 0, w, h);
                o.strokeStyle = '#EEE8F3';
                o.lineWidth = Math.max(1, k);
                o.beginPath();
                for (let x = 0; x <= w; x += CC.G * k) { o.moveTo(x + .5, 0); o.lineTo(x + .5, h); }
                for (let y = 0; y <= h; y += CC.G * k) { o.moveTo(0, y + .5); o.lineTo(w, y + .5); }
                o.stroke();
                const ink = document.createElement('canvas');
                ink.width = w; ink.height = h;
                const ix = ink.getContext('2d');
                ix.setTransform(k, 0, 0, k, 0, 0);
                CC.pages[i].forEach(st => calcStroke(ix, st));
                o.drawImage(ink, 0, 0);
                return out;
            }

            // 所有頁合併成一張（2 欄排列，含頁碼角標）
            function calcComposite(k) {
                const gap = Math.round(16 * k * 2), pad = gap;
                const pw = Math.round(CC.PW * k), ph = Math.round(CC.PH * k);
                const out = document.createElement('canvas');
                const n = CC.pages.length, rows = Math.ceil(n / 2);
                out.width = pw * 2 + gap + pad * 2;
                out.height = ph * rows + gap * (rows - 1) + pad * 2;
                const o = out.getContext('2d');
                o.fillStyle = '#F6F1F8';
                o.fillRect(0, 0, out.width, out.height);
                for (let i = 0; i < n; i++) {
                    const x = pad + (i % 2) * (pw + gap), y = pad + Math.floor(i / 2) * (ph + gap);
                    o.save();
                    o.shadowColor = 'rgba(120,100,150,.18)';
                    o.shadowBlur = 12 * k;
                    o.shadowOffsetY = 3 * k;
                    o.fillStyle = '#fff';
                    o.fillRect(x, y, pw, ph);
                    o.restore();
                    o.drawImage(calcPageImage(i, k), x, y);
                    const r = 18 * k * 1.4;
                    o.fillStyle = 'rgba(143,135,156,.55)';
                    o.beginPath();
                    o.arc(x + r + 10 * k, y + r + 10 * k, r, 0, Math.PI * 2);
                    o.fill();
                    o.fillStyle = '#fff';
                    o.font = `bold ${Math.round(r * 1.1)}px -apple-system, "PingFang TC", sans-serif`;
                    o.textAlign = 'center';
                    o.textBaseline = 'middle';
                    o.fillText(String(i + 1), x + r + 10 * k, y + r + 10 * k + 1);
                }
                return out;
            }

            // 整頁匯出：iPad 可透過分享選單「儲存影像」存入相簿
            $('#calcExport').onclick = async () => {
                const c = calcComposite(1);
                const blob = await new Promise(r => c.toBlob(r, 'image/png'));
                const fname = `計算過程_${S.name || '作業'}.png`;
                try {
                    const file = new File([blob], fname, { type: 'image/png' });
                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        await navigator.share({ files: [file], title: '計算過程' });
                        return;
                    }
                } catch (e) {
                    if (e && e.name === 'AbortError') return;
                }
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = fname;
                document.body.appendChild(a);
                a.click();
                a.remove();
                setTimeout(() => URL.revokeObjectURL(a.href), 5000);
                toast('⬇️ 已下載計算過程圖');
            };

            $('#calcSubmit').onclick = async e => {
                const empty = CC.pages.map(p => p.length === 0);
                if (empty.every(Boolean) && !(await confirmBox('還沒有寫任何計算', '確定要直接送出嗎？', '送出'))) return;
                const btn = e.currentTarget;
                if (CC.focus >= 0) closeFocus();
                const pages = CC.pages.map((_, i) => calcPageImage(i, 1).toDataURL('image/jpeg', 0.85));
                const content = calcComposite(0.5).toDataURL('image/jpeg', 0.85);
                submit('calc', content, btn, { pages, empty });
            };

            new ResizeObserver(() => { if (S.screen === 'calc') calcLayout(); }).observe($('#calcArea'));

            // ---------- 螢幕常亮 ----------
            let wakeLock = null;
            async function requestWakeLock() {
                try {
                    if ('wakeLock' in navigator && !wakeLock) {
                        wakeLock = await navigator.wakeLock.request('screen');
                        wakeLock.addEventListener('release', () => { wakeLock = null; });
                    }
                } catch (e) { }
            }

            // 已記住名字時自動加入
            if (nameInput.value) join();
        })();
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="課堂互動">
    <meta name="theme-color" content="#FBF7F4">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>課堂互動</title>
    <style>
        :root {
            --bg: #FBF7F4;
            --surface: #FFFFFF;
            --surface-2: #F6F1F8;
            --line: #ECE4EF;
            --ink: #4A4358;
            --muted: #8F879C;
            --pink: #F9D3DF;
            --pink-d: #E88AAB;
            --mint: #CDEFE2;
            --mint-d: #5FBF9C;
            --lav: #E2D8F6;
            --lav-d: #9C84DB;
            --lemon: #FFF1BF;
            --lemon-d: #E3BD45;
            --peach: #FFDCCB;
            --peach-d: #EF9A77;
            --sky: #D3E8F8;
            --sky-d: #6FAEDD;
            --radius: 22px;
            --shadow: 0 10px 30px rgba(120, 100, 150, .14), 0 2px 6px rgba(120, 100, 150, .08);
            --sat: env(safe-area-inset-top, 0px);
            --sab: env(safe-area-inset-bottom, 0px);
            --sal: env(safe-area-inset-left, 0px);
            --sar: env(safe-area-inset-right, 0px);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            height: 100%;
            background: var(--bg);
            color: var(--ink);
            font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            overflow: hidden;
            overscroll-behavior: none;
            -webkit-text-size-adjust: 100%;
        }

        button {
            font: inherit;
            color: inherit;
            border: none;
            background: none;
            cursor: pointer;
            touch-action: manipulation;
        }

        /* ---------- 共用元件 ---------- */
        .screen {
            position: fixed;
            inset: 0;
            display: none;
            flex-direction: column;
            padding: var(--sat) var(--sar) var(--sab) var(--sal);
        }

        .screen.active {
            display: flex;
        }

        .blob {
            position: fixed;
            border-radius: 50%;
            opacity: .75;
            z-index: -1;
            pointer-events: none;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 56px;
            padding: 0 26px;
            border-radius: 18px;
            font-size: 19px;
            font-weight: 700;
            background: var(--surface);
            border: 1px solid var(--line);
            white-space: nowrap;
            transition: transform .12s ease, filter .12s ease, background .2s;
        }

        .btn:active {
            transform: scale(.97);
            filter: brightness(.97);
        }

        .btn:disabled {
            opacity: .5;
        }

        .btn.pink {
            background: var(--pink);
            border-color: var(--pink);
        }

        .btn.primary {
            background: linear-gradient(135deg, #D9CBF7, #F6CFE0);
            border: none;
            box-shadow: 0 6px 16px rgba(156, 132, 219, .28);
        }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            height: 36px;
            padding: 0 14px;
            border-radius: 999px;
            background: var(--surface);
            border: 1px solid var(--line);
            font-weight: 700;
            font-size: 15px;
            white-space: nowrap;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--mint-d);
            box-shadow: 0 0 0 4px rgba(95, 191, 156, .2);
        }

        .dot.off {
            background: var(--pink-d);
            box-shadow: 0 0 0 4px rgba(232, 138, 171, .2);
        }

        /* ---------- 加入 / 等待 / 已送出 ---------- */
        #join,
        #waiting,
        #sent {
            align-items: center;
            justify-content: center;
        }

        .center-card {
            width: min(520px, calc(100vw - 48px));
            padding: 44px 40px 36px;
            text-align: center;
        }

        .logo {
            width: 92px;
            height: 92px;
            margin: 0 auto 18px;
            border-radius: 30px;
            display: grid;
            place-items: center;
            font-size: 46px;
            background: linear-gradient(135deg, var(--lav), var(--pink));
            box-shadow: 0 8px 20px rgba(156, 132, 219, .25);
        }

        h1 {
            margin: 0 0 6px;
            font-size: 32px;
            letter-spacing: 1px;
        }

        .sub {
            margin: 0 0 28px;
            color: var(--muted);
            font-size: 17px;
            line-height: 1.6;
        }

        .field {
            width: 100%;
            height: 64px;
            padding: 0 22px;
            border-radius: 18px;
            border: 2px solid var(--line);
            background: var(--surface-2);
            font-size: 22px;
            color: var(--ink);
            text-align: center;
            outline: none;
            -webkit-user-select: text;
            user-select: text;
        }

        .field:focus {
            border-color: var(--lav-d);
            background: #fff;
        }

        .center-card .btn {
            width: 100%;
            margin-top: 18px;
            min-height: 64px;
            font-size: 21px;
        }

        .palette {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 26px;
        }

        .palette i {
            width: 14px;
            height: 14px;
            border-radius: 50%;
        }

        .shake {
            animation: shake .35s;
        }

        @keyframes shake {

            20%,
            60% {
                transform: translateX(-8px)
            }

            40%,
            80% {
                transform: translateX(8px)
            }
        }

        .hello {
            font-size: 28px;
            font-weight: 800;
            margin: 0 0 10px;
        }

        .dots {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 34px 0 8px;
        }

        .dots i {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            animation: bounce 1.2s infinite ease-in-out;
        }

        .dots i:nth-child(1) {
            background: var(--pink-d);
        }

        .dots i:nth-child(2) {
            background: var(--lemon-d);
            animation-delay: .15s;
        }

        .dots i:nth-child(3) {
            background: var(--mint-d);
            animation-delay: .3s;
        }

        .dots i:nth-child(4) {
            background: var(--sky-d);
            animation-delay: .45s;
        }

        @keyframes bounce {

            0%,
            80%,
            100% {
                transform: translateY(0);
                opacity: .6
            }

            40% {
                transform: translateY(-14px);
                opacity: 1
            }
        }

        .link-btn {
            margin-top: 22px;
            color: var(--muted);
            font-size: 15px;
            text-decoration: underline;
            text-underline-offset: 4px;
            padding: 8px;
        }

        .check {
            width: 110px;
            height: 110px;
            margin: 0 auto 22px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 56px;
            background: var(--mint);
            color: #3E8F72;
            animation: pop .45s cubic-bezier(.2, 1.4, .4, 1);
        }

        @keyframes pop {
            from {
                transform: scale(.4);
                opacity: 0
            }

            to {
                transform: scale(1);
                opacity: 1
            }
        }

        /* ---------- 選擇 / 簡答：精簡頂列 + 截圖最大化 ---------- */
        .topbar {
            flex: none;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px 6px;
        }

        .topbar .title {
            font-size: 18px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .type-badge {
            display: grid;
            place-items: center;
            width: 34px;
            height: 34px;
            border-radius: 11px;
            font-size: 19px;
        }

        .topbar .hint {
            color: var(--muted);
            font-size: 15px;
        }

        .spacer {
            flex: 1;
        }

        .body {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 0 10px 10px;
        }

        .qimg-wrap {
            position: relative;
            flex: 1;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            overflow: hidden;
            border-radius: 16px;
        }

        .qimg-wrap img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            -webkit-user-drag: none;
        }

        .zoom-tip {
            position: absolute;
            right: 12px;
            bottom: 10px;
            font-size: 13px;
            color: var(--muted);
            background: rgba(255, 255, 255, .88);
            padding: 4px 10px;
            border-radius: 999px;
            pointer-events: none;
        }

        .answer-row {
            flex: none;
            display: flex;
            gap: 10px;
            align-items: stretch;
        }

        .choices {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .choice {
            height: 84px;
            border-radius: 22px;
            font-size: 40px;
            font-weight: 800;
            border: 3px solid transparent;
            transition: transform .12s, box-shadow .2s, border-color .2s, opacity .2s;
        }

        .choice:active {
            transform: scale(.96);
        }

        .choice[data-opt="A"] {
            background: var(--pink);
        }

        .choice[data-opt="B"] {
            background: var(--mint);
        }

        .choice[data-opt="C"] {
            background: var(--sky);
        }

        .choice[data-opt="D"] {
            background: var(--lemon);
        }

        .choice.on {
            border-color: var(--ink);
            box-shadow: 0 8px 18px rgba(74, 67, 88, .18);
        }

        .choices.has-pick .choice:not(.on) {
            opacity: .5;
        }

        .answer-row>.btn {
            flex: none;
            min-width: 150px;
            height: auto;
            font-size: 20px;
        }

        @media (orientation: portrait) {
            .answer-row.choice-row {
                flex-direction: column;
            }

            .answer-row.choice-row>.btn {
                min-height: 60px;
            }
        }

        textarea.answer {
            flex: 1;
            height: 96px;
            padding: 14px 18px;
            border-radius: 18px;
            border: 2px solid var(--line);
            background: var(--surface);
            font: inherit;
            font-size: 20px;
            line-height: 1.45;
            color: var(--ink);
            resize: none;
            outline: none;
            -webkit-user-select: text;
            user-select: text;
        }

        textarea.answer:focus {
            border-color: var(--lav-d);
        }

        .count {
            color: var(--muted);
            font-size: 14px;
            text-align: right;
            margin-top: -4px;
        }

        #text.typing .qimg-wrap {
            flex: 0 1 26vh;
        }

        /* ---------- 塗鴉：全螢幕畫布 + 可收合工具列 ---------- */
        #draw {
            padding: 0;
        }

        #stage {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 1px 1px, #E6DEEB 1px, transparent 0) 0 0/22px 22px,
                var(--surface-2);
            overflow: hidden;
            touch-action: none;
        }

        #stage canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .toolbar {
            position: absolute;
            left: 50%;
            bottom: calc(10px + var(--sab));
            transform: translateX(-50%);
            max-width: calc(100vw - 20px - var(--sal) - var(--sar));
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            border-radius: 26px;
            background: rgba(255, 255, 255, .96);
            border: 1px solid var(--line);
            box-shadow: var(--shadow);
            z-index: 5;
        }

        .toolbar.collapsed {
            left: auto;
            right: calc(10px + var(--sar));
            transform: none;
        }

        .toolbar.collapsed .tools {
            display: none;
        }

        .tools {
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 6px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .tools::-webkit-scrollbar {
            display: none;
        }

        @media (max-width: 1000px) {
            .tools {
                flex-wrap: wrap;
                row-gap: 6px;
                overflow: visible;
            }

            .tools .sep.s2 {
                display: none;
            }
        }

        .sep {
            flex: none;
            width: 1px;
            height: 32px;
            background: var(--line);
            margin: 0 3px;
        }

        .tbtn {
            flex: none;
            width: 50px;
            height: 50px;
            border-radius: 15px;
            display: grid;
            place-items: center;
            font-size: 23px;
            transition: background .15s, transform .12s;
        }

        .tbtn:active {
            transform: scale(.92);
        }

        .tbtn.on {
            background: var(--lav);
            box-shadow: inset 0 0 0 2px var(--lav-d);
        }

        #toggleBtn {
            background: var(--surface-2);
            font-size: 20px;
        }

        .swatch {
            flex: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: grid;
            place-items: center;
        }

        .swatch i {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .1);
        }

        .swatch.on {
            box-shadow: 0 0 0 3px var(--ink);
        }

        .size {
            flex: none;
            width: 44px;
            height: 44px;
            border-radius: 14px;
            display: grid;
            place-items: center;
        }

        .size i {
            border-radius: 50%;
            background: var(--ink);
        }

        .size.on {
            background: var(--lav);
            box-shadow: inset 0 0 0 2px var(--lav-d);
        }

        .submit {
            flex: none;
            min-height: 52px;
            padding: 0 22px;
        }

        #drawInfo {
            position: absolute;
            top: calc(8px + var(--sat));
            left: calc(8px + var(--sal));
            z-index: 5;
            opacity: .9;
            pointer-events: none;
            box-shadow: var(--shadow);
            transition: opacity .6s;
        }

        #drawInfo.fade {
            opacity: 0;
        }


        /* ---------- 計算題：四格計算紙 ---------- */
        #calc {
            padding-bottom: var(--sab);
        }

        .calc-top {
            flex: none;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            padding: 8px 10px;
        }

        .qthumb {
            display: flex;
            align-items: center;
            gap: 8px;
            height: 52px;
            padding: 3px 12px 3px 3px;
            border-radius: 14px;
            background: var(--surface);
            border: 1px solid var(--line);
            font-weight: 800;
            font-size: 15px;
        }

        .qthumb img {
            height: 44px;
            width: 64px;
            object-fit: cover;
            border-radius: 10px;
            background: var(--surface-2);
        }

        .tbtn small {
            font-size: 11px;
            font-weight: 800;
            margin-left: -4px;
            align-self: end;
        }

        .calc-top .tbtn {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .calc-top .btn {
            min-height: 50px;
            padding: 0 20px;
        }

        /* 觸控筆模式切換鈕：偵測到 Apple Pencil 後出現，可手動切回手指書寫 */
        .pen-chip {
            display: none;
            height: 44px;
            cursor: pointer;
            touch-action: manipulation;
            background: var(--surface);
            border-color: var(--line);
            transition: background .2s, border-color .2s;
        }

        body.pen-seen .pen-chip {
            display: inline-flex;
        }

        body.penmode .pen-chip {
            background: var(--mint);
            border-color: var(--mint-d);
        }

        .calc-area {
            position: relative;
            flex: 1;
            min-height: 0;
            margin: 0 10px 10px;
        }

        .calc-grid {
            position: absolute;
            inset: 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-auto-rows: var(--rowh, calc(50% - 4px));
            align-content: start;
            gap: 8px;
            overflow-y: auto;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .calc-grid::-webkit-scrollbar {
            display: none;
        }

        .fadd {
            right: 10px;
            bottom: 10px;
            background: var(--mint);
            border-color: var(--mint-d);
        }

        .cpanel,
        .fpage {
            position: relative;
            background-color: #fff;
            background-image:
                linear-gradient(#EEE8F3 1px, transparent 1px),
                linear-gradient(90deg, #EEE8F3 1px, transparent 1px);
            background-size: var(--g, 40px) var(--g, 40px);
            background-position: var(--gx, 0) var(--gy, 0);
            border-radius: 14px;
            box-shadow: 0 4px 14px rgba(120, 100, 150, .12), 0 1px 3px rgba(120, 100, 150, .08);
            overflow: hidden;
        }

        .cpanel {
            cursor: pointer;
            transition: transform .12s;
        }

        .cpanel:active {
            transform: scale(.985);
        }

        .cpanel canvas,
        .fpage canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        .pbadge {
            position: absolute;
            top: 8px;
            left: 8px;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: rgba(143, 135, 156, .42);
            color: #fff;
            font-size: 13px;
            font-weight: 800;
            pointer-events: none;
            z-index: 2;
        }

        .calc-focus {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 6;
            background: rgba(251, 247, 244, 0);
            transition: background .3s;
        }

        .calc-focus.show {
            display: flex;
        }

        .calc-focus.on {
            background: rgba(251, 247, 244, .96);
        }

        .fpage {
            transform-origin: 0 0;
            touch-action: none;
            border-radius: 18px;
        }

        .fpage canvas {
            touch-action: none;
        }

        .fbtn {
            position: absolute;
            z-index: 7;
            height: 54px;
            padding: 0 18px;
            border-radius: 999px;
            background: rgba(255, 255, 255, .94);
            border: 1px solid var(--line);
            box-shadow: var(--shadow);
            font-size: 17px;
            font-weight: 800;
            opacity: 0;
            transition: opacity .25s;
        }

        .calc-focus.on .fbtn {
            opacity: 1;
        }

        .fback {
            top: 10px;
            left: 10px;
        }

        .fprev,
        .fnext {
            top: 50%;
            transform: translateY(-50%);
            width: 60px;
            height: 76px;
            padding: 0;
            font-size: 24px;
            border-radius: 22px;
        }

        .fprev {
            left: 6px;
        }

        .fnext {
            right: 6px;
        }

        /* 查看前一頁（浮動預覽，可拖曳、放大、翻看更早的頁） */
        .fpeek {
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--lemon);
            border-color: var(--lemon-d);
        }

        .fpeek.on {
            background: var(--surface);
            border-color: var(--line);
        }

        .peek {
            position: absolute;
            top: 74px;
            right: 76px;
            width: 38%;
            display: none;
            flex-direction: column;
            z-index: 8;
            border-radius: 18px;
            background: rgba(255, 255, 255, .98);
            border: 2px solid var(--lemon-d);
            box-shadow: 0 16px 40px rgba(74, 67, 88, .25);
            overflow: hidden;
        }

        .peek.show {
            display: flex;
        }

        .peek.big {
            width: 62%;
        }

        .peek-head {
            flex: none;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 6px 6px 6px 14px;
            background: var(--lemon);
            font-weight: 800;
            font-size: 16px;
            touch-action: none;
            cursor: move;
        }

        .peek-head button {
            width: 42px;
            height: 38px;
            border-radius: 12px;
            background: rgba(255, 255, 255, .75);
            font-size: 17px;
            font-weight: 800;
        }

        .peek-head button:disabled {
            opacity: .3;
        }

        .peek-body {
            position: relative;
            margin: 6px;
            border-radius: 12px;
            overflow: hidden;
            background-color: #fff;
            background-image:
                linear-gradient(#EEE8F3 1px, transparent 1px),
                linear-gradient(90deg, #EEE8F3 1px, transparent 1px);
            background-size: var(--g, 20px) var(--g, 20px);
        }

        .peek-body canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        .fnext-pill {
            right: 10px;
            bottom: 10px;
        }

        .modal .col {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* ---------- 浮層 ---------- */
        #toast {
            position: fixed;
            left: 50%;
            top: calc(16px + var(--sat));
            transform: translate(-50%, -30px);
            opacity: 0;
            pointer-events: none;
            padding: 14px 24px;
            border-radius: 999px;
            background: rgba(74, 67, 88, .92);
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            transition: all .25s ease;
            z-index: 100;
            max-width: calc(100vw - 40px);
            text-align: center;
        }

        #toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        #offline {
            position: fixed;
            top: calc(12px + var(--sat));
            left: 50%;
            transform: translateX(-50%);
            display: none;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            border-radius: 999px;
            background: var(--pink);
            font-weight: 700;
            z-index: 90;
            box-shadow: var(--shadow);
        }

        #offline.show {
            display: flex;
        }

        #pausedBar {
            position: fixed;
            top: calc(12px + var(--sat));
            left: 50%;
            transform: translateX(-50%);
            display: none;
            align-items: center;
            gap: 10px;
            padding: 12px 24px;
            border-radius: 999px;
            background: var(--lemon);
            border: 2px solid var(--lemon-d);
            font-size: 18px;
            font-weight: 800;
            z-index: 91;
            box-shadow: var(--shadow);
            pointer-events: none;
        }

        body.paused #pausedBar {
            display: flex;
        }

        .modal {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(74, 67, 88, .28);
            -webkit-backdrop-filter: blur(6px);
            backdrop-filter: blur(6px);
            z-index: 80;
        }

        .modal.show {
            display: flex;
        }

        .modal .card {
            width: min(420px, calc(100vw - 48px));
            padding: 32px 28px 24px;
            text-align: center;
        }

        .modal h3 {
            margin: 0 0 8px;
            font-size: 22px;
        }

        .modal p {
            margin: 0 0 24px;
            color: var(--muted);
            font-size: 17px;
        }

        .modal .row {
            display: flex;
            gap: 12px;
        }

        .modal .row .btn {
            flex: 1;
        }

        #viewer {
            background: rgba(251, 247, 244, .98);
            padding: calc(10px + var(--sat)) 10px calc(10px + var(--sab));
        }

        #viewer img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        #viewer .close {
            position: fixed;
            top: calc(12px + var(--sat));
            right: 14px;
        }
    </style>
</head>

<body>
    <div class="blob" style="width:340px;height:340px;background:var(--pink);top:-120px;left:-100px"></div>
    <div class="blob" style="width:300px;height:300px;background:var(--mint);bottom:-110px;right:-80px"></div>
    <div class="blob" style="width:200px;height:200px;background:var(--lemon);top:30%;right:-90px"></div>

    <!-- 1. 加入 -->
    <section id="join" class="screen active">
        <div class="card center-card" id="joinCard">
            <div class="logo">🖍️</div>
            <h1>課堂互動</h1>
            <p class="sub">輸入你的名字，加入老師的課堂</p>
            <input id="nameInput" class="field" maxlength="20" placeholder="你的名字 / 座號" autocomplete="off"
                enterkeyhint="go">
            <button id="joinBtn" class="btn primary">加入課堂 →</button>
            <div class="palette">
                <i style="background:var(--pink-d)"></i><i style="background:var(--peach-d)"></i>
                <i style="background:var(--lemon-d)"></i><i style="background:var(--mint-d)"></i>
                <i style="background:var(--sky-d)"></i><i style="background:var(--lav-d)"></i>
            </div>
        </div>
    </section>

    <!-- 2. 等待 -->
    <section id="waiting" class="screen">
        <div class="card center-card">
            <p class="hello">嗨，<span class="me-name"></span> 👋</p>
            <p class="sub" id="waitText" style="margin:0">已加入課堂，等待老師發送題目…</p>
            <div class="dots"><i></i><i></i><i></i><i></i></div>
            <button class="link-btn" id="renameBtn">不是你嗎？更換名字</button>
        </div>
    </section>

    <!-- 3. 塗鴉（全螢幕） -->
    <section id="draw" class="screen">
        <div id="stage">
            <canvas id="bgC"></canvas>
            <canvas id="inkC"></canvas>
            <canvas id="liveC"></canvas>
        </div>
        <span class="chip" id="drawInfo"><span class="dot net-dot"></span>🎨 塗鴉題 · <span class="me-name"></span></span>
        <div class="toolbar" id="toolbar">
            <button class="tbtn" id="toggleBtn" title="收合工具">▾</button>
            <div class="tools">
                <button class="tbtn on" data-tool="pen" title="畫筆">✏️</button>
                <button class="tbtn" data-tool="marker" title="螢光筆">🖍️</button>
                <button class="tbtn" data-tool="eraser" title="橡皮擦">🧽</button>
                <span class="sep"></span>
                <div id="swatches" style="display:flex;gap:4px"></div>
                <span class="sep s2"></span>
                <div id="sizes" style="display:flex;gap:2px"></div>
                <span class="sep"></span>
                <button class="tbtn" id="undoBtn" title="復原">↶</button>
                <button class="tbtn" id="redoBtn" title="重做">↷</button>
                <button class="tbtn" id="clearBtn" title="全部清除">🗑️</button>
            </div>
            <button class="btn primary submit" id="drawSubmit">送出 ✓</button>
        </div>
    </section>

    <!-- 4. 選擇題 -->
    <section id="choice" class="screen">
        <div class="topbar">
            <div class="title"><span class="type-badge" style="background:var(--sky)">🔤</span>選擇題</div>
            <span class="hint" id="choiceNote">點選一個答案後送出</span>
            <div class="spacer"></div>
            <span class="chip"><span class="dot net-dot"></span><span class="me-name"></span></span>
        </div>
        <div class="body">
            <div class="qimg-wrap card"><img alt="題目" class="qimg"><span class="zoom-tip">點圖放大</span></div>
            <div class="answer-row choice-row">
                <div class="choices" id="choices">
                    <button class="choice" data-opt="A">A</button>
                    <button class="choice" data-opt="B">B</button>
                    <button class="choice" data-opt="C">C</button>
                    <button class="choice" data-opt="D">D</button>
                </div>
                <button class="btn primary" id="choiceSubmit" disabled>送出 ✓</button>
            </div>
        </div>
    </section>

    <!-- 5. 簡答題 -->
    <section id="text" class="screen">
        <div class="topbar">
            <div class="title"><span class="type-badge" style="background:var(--peach)">📝</span>簡答題</div>
            <span class="hint" id="textCount">0 / 300</span>
            <div class="spacer"></div>
            <span class="chip"><span class="dot net-dot"></span><span class="me-name"></span></span>
        </div>
        <div class="body">
            <div class="qimg-wrap card"><img alt="題目" class="qimg"><span class="zoom-tip">點圖放大</span></div>
            <div class="answer-row">
                <textarea id="textAnswer" class="answer" maxlength="300" placeholder="在這裡輸入答案…"></textarea>
                <button class="btn primary" id="textSubmit">送出 ✓</button>
            </div>
        </div>
    </section>

    <!-- 6. 已送出 -->
    <section id="sent" class="screen">
        <div class="card center-card">
            <div class="check">✓</div>
            <p class="hello">答案已送出！</p>
            <p class="sub" style="margin:0">老師已經收到囉，等待下一個題目…</p>
            <button class="btn" id="editBtn">✏️ 修改答案</button>
        </div>
    </section>


    <!-- 7. 計算題（四格計算紙） -->
    <section id="calc" class="screen">
        <div class="calc-top">
            <button class="qthumb" id="calcQBtn" title="看題目"><img id="calcQImg" alt="">題目</button>
            <span class="sep"></span>
            <button class="tbtn on" data-ctool="thin" title="細筆">✏️<small>細</small></button>
            <button class="tbtn" data-ctool="thick" title="粗筆">🖊️<small>粗</small></button>
            <button class="tbtn" data-ctool="eraser" title="橡皮擦">🧽</button>
            <span class="sep"></span>
            <div id="calcColors" style="display:flex;gap:2px"></div>
            <span class="sep"></span>
            <button class="tbtn" id="calcUndo" title="復原">↶</button>
            <button class="tbtn" id="calcClear" title="清空">🗑️</button>
            <button class="tbtn" id="calcExport" title="下載計算過程圖">⬇️</button>
            <button class="tbtn" id="calcAdd" title="新增一張計算紙">➕<small>頁</small></button>
            <div class="spacer"></div>
            <button class="chip pen-chip" id="penToggle" title="點一下切換：只用觸控筆 / 手指也能書寫">✍️ 觸控筆模式</button>
            <span class="chip"><span class="dot net-dot"></span><span class="me-name"></span></span>
            <button class="btn primary" id="calcSubmit">送出 ✓</button>
        </div>
        <div class="calc-area" id="calcArea">
            <div class="calc-grid" id="calcGrid"></div>
            <div class="calc-focus" id="calcFocus">
                <div class="fpage" id="fpage"><canvas id="fcanvas"></canvas></div>
                <button class="fbtn fback" id="fBack">⊞ 回全覽 · 第 1 頁</button>
                <button class="fbtn fprev" id="fPrev" title="上一頁">◀</button>
                <button class="fbtn fnext" id="fNext" title="下一頁">▶</button>
                <button class="fbtn fadd" id="fAdd">＋ 新增一頁</button>
                <button class="fbtn fpeek" id="fPeekBtn">👁 看第 1 頁</button>
                <div class="peek" id="peek">
                    <div class="peek-head" id="peekHead">
                        <span id="peekTitle">第 1 頁</span>
                        <span class="spacer"></span>
                        <button id="peekPrev" title="更早的頁">◀</button>
                        <button id="peekNext" title="較新的頁">▶</button>
                        <button id="peekSize" title="放大 / 縮小">⤢</button>
                        <button id="peekClose" title="收起">✕</button>
                    </div>
                    <div class="peek-body" id="peekBody"><canvas id="peekCanvas"></canvas></div>
                </div>
            </div>
        </div>
    </section>

    <!-- 浮層 -->
    <div id="safeProbe"
        style="position:fixed;visibility:hidden;pointer-events:none;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)">
    </div>
    <div id="pausedBar">⏸ 老師暫停作答中，請稍候…</div>
    <div id="offline"><span class="dot off"></span>連線中斷，正在重新連線…</div>
    <div id="toast"></div>
    <div class="modal" id="confirmModal">
        <div class="card">
            <h3 id="confirmTitle">確定嗎？</h3>
            <p id="confirmText"></p>
            <div class="row">
                <button class="btn" id="confirmNo">取消</button>
                <button class="btn pink" id="confirmYes">確定</button>
            </div>
        </div>
    </div>
    <div class="modal" id="calcClearModal">
        <div class="card">
            <h3>要清除哪裡？</h3>
            <p>清除後無法復原喔</p>
            <div class="col">
                <button class="btn pink" id="ccPage">清除第 1 頁</button>
                <button class="btn pink" id="ccAll">清除全部 4 頁</button>
                <button class="btn" id="ccDel">🗑 刪除第 1 頁</button>
                <button class="btn" id="ccCancel">取消</button>
            </div>
        </div>
    </div>
    <div class="modal" id="viewer">
        <img alt="題目放大">
        <button class="btn close">✕ 關閉</button>
    </div>

    <script>
        (() => {
            'use strict';
            const $ = s => document.querySelector(s);
            const $$ = s => Array.from(document.querySelectorAll(s));

            // ---------- 儲存 ----------
            const store = {
                get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch (e) { } }
            };
            let sid = store.get('lan_sid');
            if (!sid) {
                sid = 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
                store.set('lan_sid', sid);
            }

            const S = {
                name: '', joined: false, session: null, version: -1,
                type: 'none', screen: 'join', answerScreen: null, fails: 0, paused: false
            };

            // 暫停作答時停用所有送出按鈕
            function setPaused(on) {
                S.paused = !!on;
                document.body.classList.toggle('paused', S.paused);
                updateSubmitState();
            }
            function updateSubmitState() {
                $('#drawSubmit').disabled = S.paused;
                $('#textSubmit').disabled = S.paused;
                $('#calcSubmit').disabled = S.paused;
                $('#choiceSubmit').disabled = S.paused || !chosen;
            }

            // ---------- 畫面切換 ----------
            function show(id) {
                S.screen = id;
                $$('.screen').forEach(el => el.classList.toggle('active', el.id === id));
                if (id === 'draw') requestAnimationFrame(layoutCanvas);
                if (id === 'calc') requestAnimationFrame(calcLayout);
            }

            let toastTimer;
            function toast(msg, ms = 2200) {
                const t = $('#toast');
                t.textContent = msg;
                t.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => t.classList.remove('show'), ms);
            }

            function confirmBox(title, text, yesLabel = '確定') {
                return new Promise(resolve => {
                    $('#confirmTitle').textContent = title;
                    $('#confirmText').textContent = text;
                    $('#confirmYes').textContent = yesLabel;
                    const m = $('#confirmModal');
                    m.classList.add('show');
                    const done = v => { m.classList.remove('show'); resolve(v); };
                    $('#confirmYes').onclick = () => done(true);
                    $('#confirmNo').onclick = () => done(false);
                });
            }

            function setNetwork(ok) {
                $('#offline').classList.toggle('show', !ok && S.joined);
                $$('.net-dot').forEach(d => d.classList.toggle('off', !ok));
            }

            // ---------- API ----------
            async function api(path, body) {
                const opt = { cache: 'no-store' };
                if (body !== undefined) {
                    opt.method = 'POST';
                    opt.headers = { 'Content-Type': 'application/json' };
                    opt.body = JSON.stringify(body);
                }
                const r = await fetch(path, opt);
                let data = {};
                try { data = await r.json(); } catch (e) { }
                if (!r.ok) {
                    const err = new Error(data.error || ('HTTP ' + r.status));
                    err.status = r.status;
                    throw err;
                }
                return data;
            }

            // ---------- 加入 ----------
            const nameInput = $('#nameInput');
            nameInput.value = store.get('lan_name') || '';

            async function join() {
                const name = nameInput.value.trim();
                if (!name) {
                    const c = $('#joinCard');
                    c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake');
                    toast('請先輸入名字');
                    return;
                }
                $('#joinBtn').disabled = true;
                try {
                    const r = await api('/api/join', { sid, name });
                    S.name = name; S.joined = true; S.session = r.session;
                    store.set('lan_name', name);
                    $$('.me-name').forEach(e => e.textContent = name);
                    nameInput.blur();
                    show('waiting');
                    S.version = -1;
                    poll();
                    requestWakeLock();
                } catch (e) {
                    toast('無法連線到老師的電腦，請確認在同一個 Wi-Fi', 3200);
                } finally {
                    $('#joinBtn').disabled = false;
                }
            }
            $('#joinBtn').onclick = join;
            nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') join(); });

            $('#renameBtn').onclick = () => {
                S.joined = false;
                clearTimeout(pollTimer);
                show('join');
                setTimeout(() => nameInput.focus(), 50);
            };

            // ---------- 輪詢 ----------
            let pollTimer;
            async function poll() {
                clearTimeout(pollTimer);
                if (!S.joined) return;
                try {
                    const r = await api('/api/poll?sid=' + encodeURIComponent(sid));
                    S.fails = 0;
                    setNetwork(true);
                    if (!r.known || (S.session && r.session !== S.session)) {
                        // 老師端重新啟動：自動重新加入
                        const j = await api('/api/join', { sid, name: S.name });
                        S.session = j.session;
                        S.version = -1;
                    }
                    if (r.version !== S.version) await loadMission(r);
                    setPaused(r.paused && r.type !== 'none');
                } catch (e) {
                    if (++S.fails >= 2) setNetwork(false);
                }
                pollTimer = setTimeout(poll, 1200);
            }

            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible' && S.joined) { poll(); requestWakeLock(); }
            });

            function loadImage(src) {
                return new Promise(resolve => {
                    const img = new Image();
                    img.onload = () => resolve(img);
                    img.onerror = () => resolve(null);
                    img.src = src;
                });
            }

            async function loadMission(r) {
                if (r.type === 'none') {
                    S.version = r.version; S.type = 'none'; S.answerScreen = null;
                    $('#waitText').textContent = '已加入課堂，等待老師發送題目…';
                    show('waiting');
                    return;
                }
                const img = r.has_image ? await loadImage('/api/mission_image?v=' + r.version) : null;
                if (r.has_image && !img) return; // 下次輪詢再試
                S.version = r.version;
                S.type = r.type;
                const src = img ? img.src : '';
                $$('.qimg').forEach(el => { el.src = src; el.style.display = img ? '' : 'none'; });
                $$('.zoom-tip').forEach(el => el.style.display = img ? '' : 'none');

                if (r.type === 'draw') {
                    initDrawing(img);
                    S.answerScreen = 'draw';
                } else if (r.type === 'choice') {
                    pickChoice(null);
                    S.answerScreen = 'choice';
                } else if (r.type === 'text') {
                    $('#textAnswer').value = '';
                    updateCount();
                    S.answerScreen = 'text';
                } else if (r.type === 'calc') {
                    initCalc(img);
                    S.answerScreen = 'calc';
                }
                show(S.answerScreen);
                if (navigator.vibrate) navigator.vibrate(60);
                toast(r.retry ? '🔁 老師請大家重新作答！' : '📬 收到新題目！');
            }

            // ---------- 送出 ----------
            async function submit(type, content, btn, extra) {
                if (btn) btn.disabled = true;
                try {
                    await api('/api/answer', Object.assign({ sid, name: S.name, type, content, version: S.version }, extra || {}));
                    show('sent');
                } catch (e) {
                    if (e.status === 409) {
                        toast('題目已經更新，請重新作答');
                        S.version = -2;
                        poll();
                    } else if (e.status === 423) {
                        toast('⏸ 老師暫停作答中，請稍後再送出');
                        setPaused(true);
                    } else {
                        toast('送出失敗，請再試一次');
                    }
                } finally {
                    updateSubmitState();
                }
            }

            $('#editBtn').onclick = () => { if (S.answerScreen) show(S.answerScreen); };

            // ---------- 選擇題 ----------
            let chosen = null;
            function pickChoice(opt) {
                chosen = opt;
                $$('.choice').forEach(b => b.classList.toggle('on', b.dataset.opt === opt));
                $('#choices').classList.toggle('has-pick', !!opt);
                updateSubmitState();
                $('#choiceNote').textContent = opt ? `你選擇了 ${opt}` : '點選一個答案後送出';
            }
            $$('.choice').forEach(b => b.onclick = () => pickChoice(b.dataset.opt));
            $('#choiceSubmit').onclick = e => chosen && submit('choice', chosen, e.currentTarget);

            // ---------- 簡答題 ----------
            const ta = $('#textAnswer');
            function updateCount() { $('#textCount').textContent = `${ta.value.length} / 300`; }
            ta.addEventListener('input', updateCount);
            ta.addEventListener('focus', () => $('#text').classList.add('typing'));
            // 延遲還原版面，避免點「送出」時版面位移導致點擊落空
            ta.addEventListener('blur', () => setTimeout(() => $('#text').classList.remove('typing'), 300));
            $('#textSubmit').onclick = e => {
                const v = ta.value.trim();
                if (!v) { toast('請先輸入答案'); return; }
                ta.blur();
                submit('text', v, e.currentTarget);
            };

            // ---------- 圖片放大 ----------
            $$('.qimg').forEach(img => img.onclick = () => {
                $('#viewer img').src = img.src;
                $('#viewer').classList.add('show');
            });
            $('#viewer').onclick = () => $('#viewer').classList.remove('show');

            // ---------- 塗鴉引擎 ----------
            const COLORS = ['#E5484D', '#F08C2E', '#F5C518', '#2FA37A', '#3E7BFA', '#8E5CD9', '#EC6FA5', '#2B2B2B', '#FFFFFF'];
            const SIZES = [3, 6, 12, 22];
            const stage = $('#stage'), bgC = $('#bgC'), inkC = $('#inkC'), liveC = $('#liveC');
            const bgX = bgC.getContext('2d'), inkX = inkC.getContext('2d'), liveX = liveC.getContext('2d');
            const D = {
                img: null, W: 1200, H: 900, strokes: [], redo: [],
                tool: 'pen', color: COLORS[0], size: SIZES[1],
                fit: { s: 1, ox: 0, oy: 0 }, dpr: 1, cur: null, pid: null, lastPen: 0
            };

            // 工具列
            const swWrap = $('#swatches');
            COLORS.forEach((c, i) => {
                const b = document.createElement('button');
                b.className = 'swatch' + (i === 0 ? ' on' : '');
                b.innerHTML = `<i style="background:${c}"></i>`;
                b.onclick = () => {
                    D.color = c;
                    $$('.swatch').forEach(s => s.classList.toggle('on', s === b));
                    if (D.tool === 'eraser') setTool('pen');
                };
                swWrap.appendChild(b);
            });
            const szWrap = $('#sizes');
            SIZES.forEach((s, i) => {
                const b = document.createElement('button');
                b.className = 'size' + (i === 1 ? ' on' : '');
                const d = Math.min(6 + i * 6, 26);
                b.innerHTML = `<i style="width:${d}px;height:${d}px"></i>`;
                b.onclick = () => { D.size = s; $$('.size').forEach(x => x.classList.toggle('on', x === b)); };
                szWrap.appendChild(b);
            });
            function setTool(t) {
                D.tool = t;
                $$('.tbtn[data-tool]').forEach(b => b.classList.toggle('on', b.dataset.tool === t));
            }
            $$('.tbtn[data-tool]').forEach(b => b.onclick = () => setTool(b.dataset.tool));

            // 工具列收合
            const toolbar = $('#toolbar');
            function setCollapsed(on) {
                toolbar.classList.toggle('collapsed', on);
                $('#toggleBtn').textContent = on ? '🖌️' : '▾';
                $('#toggleBtn').title = on ? '展開工具' : '收合工具';
                store.set('lan_tb_collapsed', on ? '1' : '0');
            }
            $('#toggleBtn').onclick = () => setCollapsed(!toolbar.classList.contains('collapsed'));
            setCollapsed(store.get('lan_tb_collapsed') === '1');

            function initDrawing(img) {
                D.img = img;
                D.W = img ? img.naturalWidth : 1200;
                D.H = img ? img.naturalHeight : 900;
                D.strokes = []; D.redo = []; D.cur = null; D.pid = null;
                D.t0 = performance.now();
                updateUndo();
                const info = $('#drawInfo');
                info.classList.remove('fade');
                clearTimeout(info._t);
                info._t = setTimeout(() => info.classList.add('fade'), 4000);
                layoutCanvas();
            }

            function layoutCanvas() {
                const r = stage.getBoundingClientRect();
                if (!r.width || !r.height) return;
                const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
                D.dpr = dpr;
                [bgC, inkC, liveC].forEach(c => { c.width = Math.round(r.width * dpr); c.height = Math.round(r.height * dpr); });
                // 截圖最大化：扣除安全區域後盡量填滿整個螢幕
                const ps = getComputedStyle($('#safeProbe'));
                const top = parseFloat(ps.paddingTop) || 0;
                const bot = parseFloat(ps.paddingBottom) || 0;
                const availH = r.height - top - bot;
                const s = Math.min(r.width / D.W, availH / D.H);
                D.fit = { s, ox: (r.width - D.W * s) / 2, oy: top + (availH - D.H * s) / 2 };
                drawBackground();
                redrawInk();
            }

            function setView(ctx) {
                const { s, ox, oy } = D.fit, k = D.dpr;
                ctx.setTransform(k * s, 0, 0, k * s, k * ox, k * oy);
            }

            function drawBackground() {
                bgX.setTransform(1, 0, 0, 1, 0, 0);
                bgX.clearRect(0, 0, bgC.width, bgC.height);
                setView(bgX);
                bgX.fillStyle = '#fff';
                bgX.fillRect(0, 0, D.W, D.H);
                if (D.img) bgX.drawImage(D.img, 0, 0, D.W, D.H);
            }

            function strokeStyle(ctx, st) {
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.lineWidth = st.w;
                ctx.globalAlpha = st.tool === 'marker' ? 0.38 : 1;
                ctx.globalCompositeOperation = st.tool === 'eraser' ? 'destination-out' : 'source-over';
                ctx.strokeStyle = st.tool === 'eraser' ? '#000' : st.color;
                ctx.fillStyle = ctx.strokeStyle;
            }

            function tracePath(ctx, pts) {
                ctx.beginPath();
                if (pts.length === 1) {
                    ctx.arc(pts[0][0], pts[0][1], ctx.lineWidth / 2, 0, Math.PI * 2);
                    ctx.fill();
                    return;
                }
                ctx.moveTo(pts[0][0], pts[0][1]);
                for (let i = 1; i < pts.length - 1; i++) {
                    const mx = (pts[i][0] + pts[i + 1][0]) / 2, my = (pts[i][1] + pts[i + 1][1]) / 2;
                    ctx.quadraticCurveTo(pts[i][0], pts[i][1], mx, my);
                }
                const last = pts[pts.length - 1];
                ctx.lineTo(last[0], last[1]);
                ctx.stroke();
            }

            function paintStroke(ctx, st) {
                ctx.save();
                ctx.beginPath();
                ctx.rect(0, 0, D.W, D.H);
                ctx.clip();
                strokeStyle(ctx, st);
                tracePath(ctx, st.pts);
                ctx.restore();
            }

            function redrawInk() {
                inkX.setTransform(1, 0, 0, 1, 0, 0);
                inkX.clearRect(0, 0, inkC.width, inkC.height);
                setView(inkX);
                D.strokes.forEach(st => paintStroke(inkX, st));
            }

            function renderLive() {
                liveX.setTransform(1, 0, 0, 1, 0, 0);
                liveX.clearRect(0, 0, liveC.width, liveC.height);
                if (!D.cur || D.cur.tool === 'eraser') return;
                setView(liveX);
                paintStroke(liveX, D.cur);
            }

            // 圖片座標 + 時間（ms，供老師端「繪圖重播」使用）
            function toImg(e) {
                const r = liveC.getBoundingClientRect();
                const { s, ox, oy } = D.fit;
                const ts = (e.timeStamp && e.timeStamp > 0) ? e.timeStamp : performance.now();
                return [(e.clientX - r.left - ox) / s, (e.clientY - r.top - oy) / s, Math.max(0, Math.round(ts - D.t0))];
            }

            // 筆畫在螢幕上移動的距離（px）
            function strokeTravel(st) {
                let d = 0;
                for (let i = 1; i < st.pts.length; i++) {
                    d += Math.hypot(st.pts[i][0] - st.pts[i - 1][0], st.pts[i][1] - st.pts[i - 1][1]);
                }
                return d * D.fit.s;
            }

            function abandonStroke() {
                const wasEraser = D.cur && D.cur.tool === 'eraser';
                D.cur = null; D.pid = null;
                if (wasEraser) redrawInk();
                renderLive();
            }

            // 阻止 Safari 把觸控當成捲動/縮放手勢而中斷筆畫
            ['touchstart', 'touchmove'].forEach(t =>
                stage.addEventListener(t, e => { if (e.cancelable) e.preventDefault(); }, { passive: false }));

            liveC.addEventListener('pointerdown', e => {
                if (e.pointerType === 'mouse' && e.button !== 0) return;
                if (e.pointerType === 'pen') D.lastPen = Date.now();
                // 手掌防誤觸：只在 Apple Pencil 剛使用過（2 秒內）時忽略手指
                if (e.pointerType === 'touch' && Date.now() - D.lastPen < 2000) return;
                e.preventDefault();
                if (D.cur) {
                    // 已有筆畫進行中：若它幾乎沒移動（多半是手掌或誤觸），改由新的觸點接手
                    const penTakesOver = e.pointerType === 'pen' && D.cur.ptype !== 'pen';
                    if (!penTakesOver && strokeTravel(D.cur) > 12) return;
                    abandonStroke();
                }
                try { liveC.setPointerCapture(e.pointerId); } catch (err) { }
                D.pid = e.pointerId;
                const mult = D.tool === 'marker' ? 3 : D.tool === 'eraser' ? 3.5 : 1;
                D.cur = { tool: D.tool, color: D.color, w: (D.size * mult) / D.fit.s, pts: [toImg(e)], ptype: e.pointerType };
                if (D.cur.tool === 'eraser') { setView(inkX); paintStroke(inkX, D.cur); }
                renderLive();
            });

            liveC.addEventListener('pointermove', e => {
                if (!D.cur || e.pointerId !== D.pid) return;
                e.preventDefault();
                if (e.pointerType === 'pen') D.lastPen = Date.now();
                let evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
                if (!evs || !evs.length) evs = [e];
                const before = D.cur.pts.length;
                evs.forEach(ev => D.cur.pts.push(toImg(ev)));
                if (D.cur.tool === 'eraser') {
                    const seg = { ...D.cur, pts: D.cur.pts.slice(Math.max(0, before - 1)) };
                    setView(inkX);
                    paintStroke(inkX, seg);
                } else {
                    renderLive();
                }
            });

            function endStroke(e) {
                if (!D.cur || e.pointerId !== D.pid) return;
                const st = D.cur;
                D.cur = null; D.pid = null;
                delete st.ptype;
                D.strokes.push(st);
                D.redo = [];
                if (st.tool !== 'eraser') { setView(inkX); paintStroke(inkX, st); }
                renderLive();
                updateUndo();
            }
            liveC.addEventListener('pointerup', endStroke);
            liveC.addEventListener('pointercancel', endStroke);
            liveC.addEventListener('lostpointercapture', endStroke);
            window.addEventListener('pointerup', endStroke);

            function updateUndo() {
                $('#undoBtn').style.opacity = D.strokes.length ? 1 : .35;
                $('#redoBtn').style.opacity = D.redo.length ? 1 : .35;
            }
            $('#undoBtn').onclick = () => { if (D.strokes.length) { D.redo.push(D.strokes.pop()); redrawInk(); updateUndo(); } };
            $('#redoBtn').onclick = () => { if (D.redo.length) { D.strokes.push(D.redo.pop()); redrawInk(); updateUndo(); } };
            $('#clearBtn').onclick = async () => {
                if (!D.strokes.length) return;
                if (await confirmBox('清除全部？', '畫好的內容都會被清掉喔', '清除')) {
                    D.strokes = []; D.redo = []; redrawInk(); updateUndo();
                }
            };

            function exportDrawing() {
                const k = Math.min(1, 1600 / Math.max(D.W, D.H));
                const w = Math.round(D.W * k), h = Math.round(D.H * k);
                const out = document.createElement('canvas');
                out.width = w; out.height = h;
                const ox = out.getContext('2d');
                ox.fillStyle = '#fff';
                ox.fillRect(0, 0, w, h);
                if (D.img) ox.drawImage(D.img, 0, 0, w, h);
                const ink = document.createElement('canvas');
                ink.width = w; ink.height = h;
                const ix = ink.getContext('2d');
                ix.setTransform(k, 0, 0, k, 0, 0);
                D.strokes.forEach(st => paintStroke(ix, st));
                ox.drawImage(ink, 0, 0);
                return out.toDataURL('image/jpeg', 0.88);
            }

            // 筆畫路徑（圖片原始座標）：老師端可在截圖上重播作畫過程
            function exportReplay() {
                const r1 = v => Math.round(v * 10) / 10;
                return {
                    w: D.W, h: D.H,
                    strokes: D.strokes.map(st => ({
                        tool: st.tool, color: st.color, w: r1(st.w),
                        pts: st.pts.map(p => [r1(p[0]), r1(p[1]), p[2] | 0])
                    }))
                };
            }

            $('#drawSubmit').onclick = async e => {
                if (!D.strokes.length && !(await confirmBox('還沒有畫任何東西', '確定要直接送出嗎？', '送出'))) return;
                submit('draw', exportDrawing(), e.currentTarget, { replay: exportReplay() });
            };

            new ResizeObserver(() => { if (S.screen === 'draw') layoutCanvas(); }).observe(stage);


            // ---------- 計算題：四格計算紙 ----------
            const CSIZE = { thin: 3.2, thick: 8, eraser: 34 };
            const CCOLORS = ['#2B2B2B', '#3E7BFA', '#E5484D', '#2FA37A'];
            const CC = {
                pages: [[], [], [], []], hist: [], PW: 1200, PH: 0, G: 50,
                tool: 'thin', color: CCOLORS[0], focus: -1, last: 0, penMode: false,
                cur: null, pid: null, touches: new Map(), pinch0: 0, t0: 0, fs: 1, img: null, anim: false
            };
            const CALC_MAX_PAGES = 20;
            let panels = [];
            const fpage = $('#fpage'), fcan = $('#fcanvas'), fctx = fcan.getContext('2d');
            const calcFocus = $('#calcFocus');

            const ccWrap = $('#calcColors');
            CCOLORS.forEach((c, i) => {
                const b = document.createElement('button');
                b.className = 'swatch' + (i === 0 ? ' on' : '');
                b.innerHTML = `<i style="background:${c}"></i>`;
                b.onclick = () => {
                    CC.color = c;
                    ccWrap.querySelectorAll('.swatch').forEach(x => x.classList.toggle('on', x === b));
                    if (CC.tool === 'eraser') setCalcTool('thin');
                };
                ccWrap.appendChild(b);
            });
            function setCalcTool(t) {
                CC.tool = t;
                $$('.tbtn[data-ctool]').forEach(b => b.classList.toggle('on', b.dataset.ctool === t));
            }
            $$('.tbtn[data-ctool]').forEach(b => b.onclick = () => setCalcTool(b.dataset.ctool));

            function initCalc(img) {
                CC.img = img;
                CC.pages = [[], [], [], []];
                CC.hist = [];
                CC.last = 0;
                buildPanels();
                CC.cur = null; CC.pid = null;
                CC.PH = 0;
                CC.t0 = performance.now();
                CC.focus = -1;
                calcFocus.classList.remove('show', 'on');
                if (typeof setPeek === 'function') setPeek(false);
                updateAddButtons();
                $('#calcQImg').src = img ? img.src : '';
                $('#calcQBtn').style.display = img ? '' : 'none';
            }

            function calcStroke(ctx, st) {
                ctx.save();
                ctx.beginPath();
                ctx.rect(0, 0, CC.PW, CC.PH);
                ctx.clip();
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.lineWidth = st.w;
                ctx.globalCompositeOperation = st.tool === 'eraser' ? 'destination-out' : 'source-over';
                ctx.strokeStyle = ctx.fillStyle = st.tool === 'eraser' ? '#000' : st.color;
                tracePath(ctx, st.pts);
                ctx.restore();
            }

            function renderPage(canvas, ctx, i, s, ox, oy) {
                const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.setTransform(dpr * s, 0, 0, dpr * s, dpr * ox, dpr * oy);
                CC.pages[i].forEach(st => calcStroke(ctx, st));
            }

            function sizeCanvas(c) {
                const r = c.getBoundingClientRect();
                const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
                const w = Math.round(r.width * dpr), h = Math.round(r.height * dpr);
                if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
                return r;
            }

            // 四宮格縮圖（每一筆完成後即時更新）
            function renderThumb(i) {
                const c = panels[i].querySelector('canvas');
                const r = sizeCanvas(c);
                if (!r.width) return;
                const s = Math.min(r.width / CC.PW, r.height / CC.PH);
                const ox = (r.width - CC.PW * s) / 2, oy = (r.height - CC.PH * s) / 2;
                panels[i].style.setProperty('--g', `${CC.G * s}px`);
                panels[i].style.setProperty('--gx', `${ox}px`);
                panels[i].style.setProperty('--gy', `${oy}px`);
                renderPage(c, c.getContext('2d'), i, s, ox, oy);
            }

            // 依頁數建立總覽格（2 欄；超過 4 頁時往下延伸並可捲動）
            function buildPanels() {
                const grid = $('#calcGrid');
                grid.innerHTML = '';
                panels = CC.pages.map((_, i) => {
                    const d = document.createElement('div');
                    d.className = 'cpanel';
                    d.innerHTML = `<canvas></canvas><span class="pbadge">${i + 1}</span>`;
                    d.addEventListener('click', () => openFocus(i));
                    grid.appendChild(d);
                    return d;
                });
                $('#calcAdd').disabled = CC.pages.length >= CALC_MAX_PAGES;
                $('#fAdd').disabled = CC.pages.length >= CALC_MAX_PAGES;
                updateAddButtons();
            }

            // 「新增一頁」只在目前位於最後一頁時出現（總覽時頂列的 ➕頁 保留，新增在最後）
            function updateAddButtons() {
                const inFocus = CC.focus >= 0;
                const onLast = inFocus && CC.focus === CC.pages.length - 1;
                $('#fAdd').style.display = onLast ? '' : 'none';
                $('#calcAdd').style.display = (!inFocus || onLast) ? '' : 'none';
            }

            function calcLayout() {
                const a = $('#calcArea').getBoundingClientRect();
                if (!a.height || !panels.length) return;
                $('#calcGrid').style.setProperty('--rowh', `${(a.height - 8) / 2}px`);
                const r = panels[0].getBoundingClientRect();
                if (!r.width || !r.height) return;
                if (!CC.PH) CC.PH = Math.max(500, Math.min(1800, Math.round(CC.PW * r.height / r.width)));
                panels.forEach((_, i) => renderThumb(i));
                if (CC.focus >= 0) layoutFocus();
            }

            function layoutFocus() {
                const a = $('#calcArea').getBoundingClientRect();
                const s = Math.min((a.width - 16) / CC.PW, (a.height - 16) / CC.PH);
                CC.fs = s;
                fpage.style.width = `${CC.PW * s}px`;
                fpage.style.height = `${CC.PH * s}px`;
                fpage.style.setProperty('--g', `${CC.G * s}px`);
                sizeCanvas(fcan);
                renderPage(fcan, fctx, CC.focus, s, 0, 0);
                $('#fBack').textContent = `⊞ 回全覽 · 第 ${CC.focus + 1} / ${CC.pages.length} 頁`;
                if (CC.peekOpen) {
                    if (CC.focus === 0) setPeek(false);
                    else { CC.peekPage = CC.focus - 1; renderPeek(); }  // 換頁後自動顯示新的前一頁
                }
                updatePeekButton();
                updateAddButtons();
            }

            // 點擊即放大（FLIP 動畫）
            function openFocus(i) {
                if (CC.anim) return;
                CC.focus = i; CC.last = i;
                calcFocus.classList.add('show');
                layoutFocus();
                const pr = panels[i].getBoundingClientRect(), fr = fpage.getBoundingClientRect();
                fpage.style.transition = 'none';
                fpage.style.transform = `translate(${pr.left - fr.left}px, ${pr.top - fr.top}px) scale(${pr.width / fr.width}, ${pr.height / fr.height})`;
                void fpage.offsetWidth;
                CC.anim = true;
                fpage.style.transition = 'transform .32s cubic-bezier(.2,.8,.2,1)';
                fpage.style.transform = '';
                calcFocus.classList.add('on');
                setTimeout(() => { CC.anim = false; }, 340);
            }

            function closeFocus() {
                if (CC.focus < 0 || CC.anim) return;
                if (CC.cur) abandonCalc();
                setPeek(false);
                const i = CC.focus;
                panels[i].scrollIntoView({ block: 'nearest' });
                renderThumb(i);
                const pr = panels[i].getBoundingClientRect(), fr = fpage.getBoundingClientRect();
                CC.anim = true;
                fpage.style.transition = 'transform .28s cubic-bezier(.4,0,.2,1)';
                fpage.style.transform = `translate(${pr.left - fr.left}px, ${pr.top - fr.top}px) scale(${pr.width / fr.width}, ${pr.height / fr.height})`;
                calcFocus.classList.remove('on');
                setTimeout(() => {
                    calcFocus.classList.remove('show');
                    fpage.style.transition = 'none';
                    fpage.style.transform = '';
                    CC.focus = -1;
                    CC.anim = false;
                    updateAddButtons();
                }, 290);
            }

            // 水平滑動換頁：1 ➔ 2 ➔ … ➔ 最後一頁 循環；target 可直接指定頁
            function goCalcPage(d, target) {
                if (CC.focus < 0 || CC.anim) return;
                if (CC.cur) abandonCalc();
                CC.anim = true;
                fpage.style.transition = 'transform .2s ease-in, opacity .2s';
                fpage.style.transform = `translateX(${-d * 45}%)`;
                fpage.style.opacity = '0';
                setTimeout(() => {
                    const n = CC.pages.length;
                    CC.focus = target !== undefined ? target : (CC.focus + d + n) % n;
                    CC.last = CC.focus;
                    layoutFocus();
                    fpage.style.transition = 'none';
                    fpage.style.transform = `translateX(${d * 45}%)`;
                    void fpage.offsetWidth;
                    fpage.style.transition = 'transform .24s ease-out, opacity .24s';
                    fpage.style.transform = '';
                    fpage.style.opacity = '1';
                    setTimeout(() => { CC.anim = false; }, 250);
                }, 200);
            }

            // ---------- 查看前一頁（第 2～4 頁可即時叫出前面的計算） ----------
            const peek = $('#peek'), peekCan = $('#peekCanvas'), peekCtx = peekCan.getContext('2d');
            CC.peekOpen = false;
            CC.peekPage = 0;

            function updatePeekButton() {
                const btn = $('#fPeekBtn');
                btn.style.display = CC.focus > 0 ? '' : 'none';
                btn.classList.toggle('on', CC.peekOpen);
                btn.textContent = CC.peekOpen ? '🙈 收起前一頁' : `👁 看第 ${CC.focus} 頁`;
            }

            function renderPeek() {
                if (!CC.peekOpen) return;
                const body = $('#peekBody');
                const w = body.getBoundingClientRect().width;
                body.style.height = `${w * CC.PH / CC.PW}px`;
                const s = w / CC.PW;
                body.style.setProperty('--g', `${CC.G * s}px`);
                sizeCanvas(peekCan);
                renderPage(peekCan, peekCtx, CC.peekPage, s, 0, 0);
                $('#peekTitle').textContent = `第 ${CC.peekPage + 1} 頁`;
                $('#peekPrev').disabled = CC.peekPage <= 0;
                $('#peekNext').disabled = CC.peekPage >= CC.focus - 1;
                clampPeek();
            }

            function setPeek(open) {
                CC.peekOpen = open && CC.focus > 0;
                peek.classList.toggle('show', CC.peekOpen);
                if (CC.peekOpen) {
                    CC.peekPage = CC.focus - 1;
                    requestAnimationFrame(renderPeek);
                }
                updatePeekButton();
            }

            // 預覽框保持在書寫區域內
            function clampPeek() {
                if (!peek.style.left) return;
                const a = calcFocus.getBoundingClientRect(), r = peek.getBoundingClientRect();
                const x = Math.max(0, Math.min(a.width - r.width, parseFloat(peek.style.left)));
                const y = Math.max(0, Math.min(a.height - r.height, parseFloat(peek.style.top)));
                peek.style.left = `${x}px`;
                peek.style.top = `${y}px`;
            }

            $('#fPeekBtn').onclick = () => setPeek(!CC.peekOpen);
            $('#peekClose').onclick = () => setPeek(false);
            $('#peekPrev').onclick = () => { if (CC.peekPage > 0) { CC.peekPage--; renderPeek(); } };
            $('#peekNext').onclick = () => { if (CC.peekPage < CC.focus - 1) { CC.peekPage++; renderPeek(); } };
            $('#peekSize').onclick = () => { peek.classList.toggle('big'); requestAnimationFrame(renderPeek); };

            // 拖曳標題列移動預覽框
            let peekDrag = null;
            $('#peekHead').addEventListener('pointerdown', e => {
                if (e.target.closest('button')) return;
                const a = calcFocus.getBoundingClientRect(), r = peek.getBoundingClientRect();
                peekDrag = { id: e.pointerId, dx: e.clientX - r.left, dy: e.clientY - r.top, ax: a.left, ay: a.top };
                try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) { }
            });
            $('#peekHead').addEventListener('pointermove', e => {
                if (!peekDrag || e.pointerId !== peekDrag.id) return;
                peek.style.right = 'auto';
                peek.style.left = `${e.clientX - peekDrag.ax - peekDrag.dx}px`;
                peek.style.top = `${e.clientY - peekDrag.ay - peekDrag.dy}px`;
                clampPeek();
            });
            ['pointerup', 'pointercancel'].forEach(t => $('#peekHead').addEventListener(t, () => { peekDrag = null; }));

            // ---------- 觸控筆模式 / 手寫模式切換 ----------
            function setPenMode(on) {
                CC.penMode = !!on;
                document.body.classList.toggle('penmode', CC.penMode);
                $('#penToggle').textContent = CC.penMode ? '✍️ 觸控筆模式' : '☝️ 手寫模式';
            }
            $('#penToggle').onclick = () => {
                CC.penManual = true;
                setPenMode(!CC.penMode);
                toast(CC.penMode ? '✍️ 觸控筆模式：只用筆書寫，手掌不會誤觸'
                                 : '☝️ 手寫模式：手指和觸控筆都可以書寫');
            };

            // ---------- 新增 / 刪除計算紙 ----------
            function addCalcPage() {
                if (CC.pages.length >= CALC_MAX_PAGES) { toast(`最多 ${CALC_MAX_PAGES} 頁`); return; }
                if (CC.cur) abandonCalc();
                CC.pages.push([]);
                const idx = CC.pages.length - 1;
                buildPanels();
                calcLayout();
                toast(`➕ 已新增第 ${idx + 1} 頁`);
                if (CC.focus >= 0) {
                    goCalcPage(1, idx);  // 書寫中：直接滑到新的一頁
                } else {
                    panels[idx].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                    setTimeout(() => openFocus(idx), 380);
                }
            }

            function deleteCalcPage(page) {
                if (CC.pages.length <= 1) return;
                CC.pages.splice(page, 1);
                CC.hist = CC.hist.filter(x => x !== page).map(x => (x > page ? x - 1 : x));
                CC.last = Math.min(CC.last, CC.pages.length - 1);
                buildPanels();
                if (CC.focus >= 0) {
                    CC.focus = Math.min(page, CC.pages.length - 1);
                    CC.last = CC.focus;
                }
                calcLayout();
                toast(`🗑 已刪除第 ${page + 1} 頁`);
            }

            $('#calcAdd').onclick = addCalcPage;
            $('#fAdd').onclick = addCalcPage;

            $('#fBack').onclick = closeFocus;
            $('#fPrev').onclick = () => goCalcPage(-1);
            $('#fNext').onclick = () => goCalcPage(1);
            $('#calcQBtn').onclick = () => {
                if (!CC.img) return;
                $('#viewer img').src = CC.img.src;
                $('#viewer').classList.add('show');
            };

            // 書寫：Apple Pencil 出現後只接受筆尖；兩指捏合退回總覽
            ['touchstart', 'touchmove'].forEach(t =>
                fpage.addEventListener(t, e => { if (e.cancelable) e.preventDefault(); }, { passive: false }));

            function calcPt(e) {
                const r = fcan.getBoundingClientRect();
                const ts = (e.timeStamp && e.timeStamp > 0) ? e.timeStamp : performance.now();
                return [(e.clientX - r.left) / CC.fs, (e.clientY - r.top) / CC.fs, Math.max(0, Math.round(ts - CC.t0))];
            }
            function touchDist() {
                const v = [...CC.touches.values()];
                return v.length < 2 ? 0 : Math.hypot(v[0][0] - v[1][0], v[0][1] - v[1][1]);
            }
            function abandonCalc() {
                CC.cur = null; CC.pid = null;
                if (CC.focus >= 0) renderPage(fcan, fctx, CC.focus, CC.fs, 0, 0);
            }
            function drawCalcSeg(st, from) {
                const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
                fctx.setTransform(dpr * CC.fs, 0, 0, dpr * CC.fs, 0, 0);
                if (st.pts.length === 1) { calcStroke(fctx, st); return; }
                calcStroke(fctx, { ...st, pts: st.pts.slice(Math.max(0, from - 1)) });
            }

            fcan.addEventListener('pointerdown', e => {
                if (e.pointerType === 'touch') {
                    CC.touches.set(e.pointerId, [e.clientX, e.clientY]);
                    if (CC.touches.size >= 2) {
                        if (CC.cur && CC.cur.ptype === 'touch') abandonCalc();
                        CC.pinch0 = touchDist();
